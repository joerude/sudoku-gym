[project]
name = "sudoku-gym"
version = "1.0.0"
description = "Local speed-sudoku trainer: play, drills, theory and progress stats"
requires-python = ">=3.12"
dependencies = []  # stdlib only; the dev tools (ruff, pre-commit) run through uvx, see ./gym help

[tool.ruff]
line-length = 120
target-version = "py312"
extend-exclude = ["deeptutor-skills", "wiki", "docs"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "SIM", "C4", "PIE", "RUF"]
ignore = [
    "RUF001", "RUF002", "RUF003",  # Cyrillic and typographic characters in Russian text are intended
    "RUF005",  # list concatenation reads fine here
]

[tool.ruff.lint.per-file-ignores]
"i18n.py" = ["E501"]  # one translation pair per line

[tool.ruff.lint.isort]
split-on-trailing-comma = false  # matches format.skip-magic-trailing-comma
known-first-party = ["analysis", "db", "drills", "i18n", "server", "sudoku_core", "fixtures"]

[tool.ruff.format]
skip-magic-trailing-comma = true  # keep compact one-line literals, as the code is written
