[package]
name = "sudoku-core"
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
resolver = "3"
publish = false
description = "Port of sudoku_core.py: candidates, named solving steps, solver, grading, chains"

[lib]
name = "sudoku_core"
crate-type = ["rlib", "cdylib"]

[features]
wasm = ["dep:wasm-bindgen"]

[dependencies]
wasm-bindgen = { version = "=0.2.100", optional = true }

[dev-dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
lto = true
codegen-units = 1
